name: 🐛 Bug Report
description: Report a reproducible bug or crash in Fill Your Menubar
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Fill Your Menubar Version
      placeholder: "e.g. 2.0.8"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS Version & Hardware
      placeholder: "e.g. macOS 26.0, MacBook Pro 16\" (M3 Max)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open Settings
        2. Go to Appearance -> Palette
        3. Click '-' to remove a color swatch
        4. See crash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / Crash Log
      description: Paste any crash logs or diagnostics (from Settings -> General -> Save Diagnostics) here.
      render: text
